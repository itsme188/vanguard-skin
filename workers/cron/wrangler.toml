name = "vanguard-skin-cron"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Two UTC slots per target local time — only one fires for real each day;
# the scheduled() handler gates via Intl.DateTimeFormat("America/New_York").
# Summer (EDT, UTC-4): 3pm ET = 19:00 UTC, 8:45am ET = 12:45 UTC.
# Winter (EST, UTC-5): 3pm ET = 20:00 UTC, 8:45am ET = 13:45 UTC.
#
# Calendar enrichment: every 15 min, self-gated in scheduled() to Mon-Fri
# 09:30-18:00 ET (covers both BMO 08:00 releases by T+2h and AMC 16:15
# releases by T+2h = 18:15).
#
# Evening email (Mon-Thu 7pm ET, Fri 5:30pm ET):
# Summer (EDT, UTC-4): Mon-Thu 7pm ET = 23:00 UTC same day → "0 23 * * MON-THU"
#                       Fri 5:30pm ET = 21:30 UTC same day → "30 21 * * FRI"
# Winter (EST, UTC-5): Mon-Thu 7pm ET = 00:00 UTC NEXT day → "0 0 * * TUE-FRI"
#                       Fri 5:30pm ET = 22:30 UTC same day → "30 22 * * FRI"
#
# Day-shift quirk for winter Mon-Thu: 7pm EST rolls past midnight UTC, so
# a Monday 7pm ET firing maps to "Tuesday 00:00 UTC" — hence TUE-FRI in that
# slot. The JS dispatcher reads the ET wall-clock (not UTC), so it correctly
# sees Monday/Tuesday/Wednesday/Thursday even when UTC is a day ahead.
[triggers]
crons = [
  "0 19 * * SUN",       # Sunday 3pm ET (summer) — weekly briefing
  "0 20 * * SUN",       # Sunday 3pm ET (winter) — weekly briefing
  "45 12 * * MON-FRI",  # Weekdays 8:45am ET (summer) — daily digest
  "45 13 * * MON-FRI",  # Weekdays 8:45am ET (winter) — daily digest
  "*/15 * * * *",       # Every 15 min — calendar enrich (self-gates in JS)
  "0 23 * * MON-THU",   # Mon-Thu 7pm ET (summer/EDT) — evening email
  "0 0 * * TUE-FRI",    # Mon-Thu 7pm ET (winter/EST, day-shift) — evening email
  "30 21 * * FRI",      # Fri 5:30pm ET (summer/EDT) — evening email
  "30 22 * * FRI",      # Fri 5:30pm ET (winter/EST) — evening email
]

# KV namespace — created via `wrangler kv namespace create CRON_KV`.
# Paste the returned id into the `id` field below, then `wrangler deploy`.
[[kv_namespaces]]
binding = "CRON_KV"
id = "29f6b1c9330144afad70ffb91796fcc9"

# Reused from Phase 3 PDF archival. Worker reads state/*.json.gz snapshots
# written nightly by scripts/snapshot-state-to-r2.ts. Session C adds writes.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "vanguard-skin-statements"

# Non-secret env vars. Secrets (see README) go via `wrangler secret put`.
[vars]
EXPECTED_HOUR_BRIEFING = "15"        # 3pm ET
EXPECTED_HOUR_DIGEST = "8"           # 8:45am ET (Worker gates on hour only)
# Evening email — Mon-Thu 7pm ET (hour=19), Fri 5:30pm ET (hour=17, minute=30)
EXPECTED_HOUR_EVENING_MON_THU = "19"
EXPECTED_HOUR_EVENING_FRI = "17"
EXPECTED_MINUTE_EVENING_FRI = "30"
PRIMARY_TIMEOUT_MS = "300000"        # 300s for Mac webhook. Bumped from 120s 2026-04-27: Mac's full pipeline (TWS sync + Gmail fetch + Sonnet processing + email send) routinely exceeds 120s when many articles arrive overnight, causing the Worker to fire its fallback even though the Mac email had already gone out — produced the 8:45→8:57 thinned-out duplicate.
