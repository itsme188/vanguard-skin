name = "vanguard-skin-cron"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Single */15 cron — Cloudflare's free plan caps at 5 cron triggers, and we
# need to cover briefing (Sun 3pm ET), digest (Mon-Fri 8:45am ET), evening
# (Mon-Thu 7pm ET, Fri 5:30pm ET), and calendar-enrich (every 15 min during
# market hours). All target times fall on 15-minute boundaries, so a single
# */15 cron suffices and the scheduled() handler dispatches per ET wall-clock:
#
#   - Sun 15:00 ET            → weekly briefing
#   - Mon-Fri 08:45 ET        → daily digest
#   - Mon-Thu 19:00 ET        → evening email
#   - Fri 17:30 ET            → evening email
#   - any tick, Mon-Fri        → calendar-enrich (self-gates 09:30-18:00 ET)
#                                + earnings-fallback (self-gates 05:00-20:00 ET)
#
# This pattern was already in use for calendar-enrich; consolidation
# extends it to all jobs. parseJobFromClock() reads ET wall-clock (not UTC)
# so DST handling is automatic — no day-shift quirks to maintain.
#
# Reverted from 9 specific timed crons (briefing × 2 + digest × 2 + evening × 4
# + calendar-enrich × 1) on 2026-05-08 because the 9-trigger deploy hit the
# free-plan limit. Behavior is identical: every cron tick wakes the same
# scheduled() handler which dispatches based on ET wall-clock.
[triggers]
crons = [
  "*/15 * * * *",       # Every 15 min, self-gated by parseJobFromClock + shouldRunCalendarEnrich + shouldRunEarningsFallback
]

# KV namespace — created via `wrangler kv namespace create CRON_KV`.
# Paste the returned id into the `id` field below, then `wrangler deploy`.
[[kv_namespaces]]
binding = "CRON_KV"
id = "29f6b1c9330144afad70ffb91796fcc9"

# Reused from Phase 3 PDF archival. Worker reads state/*.json.gz snapshots
# written nightly by scripts/snapshot-state-to-r2.ts. Session C adds writes.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "vanguard-skin-statements"

# Non-secret env vars. Secrets (see README) go via `wrangler secret put`.
[vars]
EXPECTED_HOUR_BRIEFING = "15"        # 3pm ET
EXPECTED_HOUR_DIGEST = "8"           # 8:45am ET (Worker gates on hour only)
# Evening email — Mon-Thu 7pm ET (hour=19), Fri 5:30pm ET (hour=17, minute=30)
EXPECTED_HOUR_EVENING_MON_THU = "19"
EXPECTED_HOUR_EVENING_FRI = "17"
EXPECTED_MINUTE_EVENING_FRI = "30"
PRIMARY_TIMEOUT_MS = "300000"        # 300s for Mac webhook. Bumped from 120s 2026-04-27: Mac's full pipeline (TWS sync + Gmail fetch + Sonnet processing + email send) routinely exceeds 120s when many articles arrive overnight, causing the Worker to fire its fallback even though the Mac email had already gone out — produced the 8:45→8:57 thinned-out duplicate.
