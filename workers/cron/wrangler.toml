name = "vanguard-skin-cron"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Two UTC slots per target local time — only one fires for real each day;
# the scheduled() handler gates via Intl.DateTimeFormat("America/New_York").
# Summer (EDT, UTC-4): 3pm ET = 19:00 UTC, 9am ET = 13:00 UTC.
# Winter (EST, UTC-5): 3pm ET = 20:00 UTC, 9am ET = 14:00 UTC.
[triggers]
crons = [
  "0 19 * * SUN",      # Sunday 3pm ET (summer) — weekly briefing
  "0 20 * * SUN",      # Sunday 3pm ET (winter) — weekly briefing
  "0 13 * * MON-FRI",  # Weekdays 9am ET (summer) — daily digest
  "0 14 * * MON-FRI",  # Weekdays 9am ET (winter) — daily digest
]

# KV namespace — created via `wrangler kv namespace create CRON_KV`.
# Paste the returned id into the `id` field below, then `wrangler deploy`.
[[kv_namespaces]]
binding = "CRON_KV"
id = "29f6b1c9330144afad70ffb91796fcc9"

# Reused from Phase 3 PDF archival. Worker reads state/*.json.gz snapshots
# written nightly by scripts/snapshot-state-to-r2.ts. Session C adds writes.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "vanguard-skin-statements"

# Non-secret env vars. Secrets (see README) go via `wrangler secret put`.
[vars]
EXPECTED_HOUR_BRIEFING = "15"        # 3pm ET
EXPECTED_HOUR_DIGEST = "9"           # 9am ET
PRIMARY_TIMEOUT_MS = "120000"        # 120s for Mac webhook
