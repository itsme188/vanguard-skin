appId: com.vanguard-skin.app
productName: Vanguard Dashboard
copyright: Copyright 2026

# Skip native module rebuild — better-sqlite3 runs under system Node.js
# (not Electron's runtime), so it must stay compiled for the system ABI.
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - dist-electron/**/*
  - public/**/*

extraResources:
  # Next.js standalone build
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
  # node_modules must be added explicitly — electron-builder excludes
  # directories named "node_modules" by default even in extraResources
  - from: .next/standalone/node_modules
    to: standalone/node_modules
    filter:
      - "**/*"
  # Static assets
  - from: .next/static
    to: standalone/.next/static
    filter:
      - "**/*"
  # Public assets
  - from: public
    to: standalone/public
    filter:
      - "**/*"
  # Migration SQL files (needed for DB initialization)
  - from: lib/db/migrations
    to: standalone/lib/db/migrations
    filter:
      - "*.sql"

mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch:
        - arm64
  darkModeSupport: true

dmg:
  title: Vanguard Dashboard
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Auto-update via GitHub Releases (no code signing required)
# On first launch after update, user may need: xattr -cr "/Applications/Vanguard Dashboard.app"
publish:
  provider: github
  owner: itsme188
  repo: vanguard-skin
