appId: com.vanguard-skin.app
productName: Vanguard Dashboard
copyright: Copyright 2026

# Skip native module rebuild — better-sqlite3 runs under system Node.js
# (not Electron's runtime), so it must stay compiled for the system ABI.
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - dist-electron/**/*
  - public/**/*

extraResources:
  # Next.js standalone build
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      # NEVER ship secrets in the DMG. next build copies .env.local into the
      # standalone output and the packaged server (cwd = Resources/standalone)
      # would auto-load it — shipping all 27 keys. Keys now come from
      # settings.json injection (electron/main.ts). The rm in electron:copy-static
      # removes it at the source; this exclusion is the defensive second layer.
      - "!.env*"
      # NEVER ship the real database (or repo internals) in the DMG. Next's
      # file tracer conservatively sweeps the project root into standalone
      # (dynamic fs paths, e.g. the print-watch watcher); discovered
      # 2026-08-21 when codesign failed on read-only .git objects — and the
      # 2026-08-19 build was ALREADY carrying data/ (4.5GB, real financial
      # DB + backups) in Resources/standalone. The packaged server reads the
      # live DB via VANGUARD_DB_DIR (db-path.ts), so none of this is needed
      # at runtime. next.config.ts outputFileTracingExcludes is the first
      # layer; this is the defensive second layer that gates the bundle.
      - "!data/**"
      - "!.git/**"
      - "!qa/**"
      - "!tests/**"
      - "!test-results/**"
      # Local Worker dev state (miniflare KV/R2/cache SQLite). The tracer
      # sweeps it in whenever `wrangler dev` has ever run in this checkout,
      # and those KV blobs carry armed-event projection data. Gitignored,
      # never read at runtime — the Worker runs on Cloudflare, not here.
      # NOTE: only the .wrangler STATE is excluded; workers/cron/src IS
      # imported at runtime (lib/calendar/enrichment-runner.ts), so the
      # source tree must stay traceable.
      - "!workers/cron/.wrangler/**"
      - "!docs/**"
      - "!scripts/**"
      - "!*.png"
      - "!*.md"
  # node_modules must be added explicitly — electron-builder excludes
  # directories named "node_modules" by default even in extraResources
  - from: .next/standalone/node_modules
    to: standalone/node_modules
    filter:
      - "**/*"
  # Static assets
  - from: .next/static
    to: standalone/.next/static
    filter:
      - "**/*"
  # Public assets
  - from: public
    to: standalone/public
    filter:
      - "**/*"
  # Migration SQL files (needed for DB initialization)
  - from: lib/db/migrations
    to: standalone/lib/db/migrations
    filter:
      - "*.sql"
  # Swift EventKit helper (reads Apple Calendar for portfolio-flagged earnings)
  - from: bin
    to: bin
    filter:
      - "read-calendar"

mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch:
        - arm64
  darkModeSupport: true
  identity: "Isaac Safier (8D2724Y4G2)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  title: Vanguard Dashboard
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Code-signed + notarized via Developer ID Application certificate.
# Auto-update via GitHub Releases.
publish:
  provider: github
  owner: itsme188
  repo: vanguard-skin
